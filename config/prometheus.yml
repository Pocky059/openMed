# Prometheus 配置文件 — OpenMed 智能问诊分流系统

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'openmed'
    environment: 'production'

rule_files:
  - "alerts/*.yml"

scrape_configs:
  # OpenMed 主应用指标
  - job_name: 'openmed-app'
    static_configs:
      - targets: ['openmed:8000']
        labels:
          service: 'openmed'
    scrape_interval: 10s
    metrics_path: '/metrics'

  # Prometheus 自监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
